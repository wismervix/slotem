services:
  # ----------------------------------------
  # Application
  # ----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: php:8.3.3-fpm
    container_name: slotem_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "9000:9000"
    depends_on:
      - db

  # ----------------------------------------
  # Nginx Web Server
  # ----------------------------------------
  web:
    image: nginx:alpine
    container_name: slotem_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # ----------------------------------------
  # MySQL Database
  # ----------------------------------------
  db:
    image: mysql:8
    container_name: slotem_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slotem
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: slotem_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db