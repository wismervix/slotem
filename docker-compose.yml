services:
  # ----------------------------------------
  # Application
  # ----------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # image: php:8.3.3-fpm
    container_name: slotem_app
    working_dir: /var/www
    restart: unless-stopped
    volumes:
      - ./:/var/www
    ports:
      - "9000:9000"
    depends_on:
      - db

  scheduler:
    build: .
    container_name: slotem_scheduler
    working_dir: /var/www
    volumes:
      - ./:/var/www
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      - app
      - db

  queue:
    build: .
    container_name: slotem_queue
    working_dir: /var/www
    volumes:
      - ./:/var/www
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      - db

  # ----------------------------------------
  # Nginx Web Server
  # ----------------------------------------
  web:
    image: nginx:alpine
    container_name: slotem_nginx
    ports:
      - "8000:80"
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # ----------------------------------------
  # MySQL Database
  # ----------------------------------------
  db:
    image: mysql:8
    container_name: slotem_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: slotem
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    volumes:
      - slotem_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: slotem_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      
volumes:
  slotem_db_data: